<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBD Dhaka South - Smart Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vbdRed: '#E31B23',
                        vbdGreen: '#006A4E',
                        vbdDarkGreen: '#004D38',
                        vbdYellow: '#FFC72C'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .search-suggestion-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0 0 12px 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-white shadow-md border-b-4 border-vbdRed sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://raw.githubusercontent.com/vbd-assets/logos/main/vbd-logo.png" 
                         onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=VBD+Dhaka+South&background=E31B23&color=fff&size=128';" 
                         alt="VBD Logo" class="h-12 w-auto object-contain">
                    <div>
                        <h1 class="font-bold text-lg leading-tight text-gray-900">Volunteer for Bangladesh</h1>
                        <p class="text-xs text-vbdGreen font-bold tracking-wide">Dhaka South District</p>
                    </div>
                </div>
                <div id="navUserMenu" class="flex items-center space-x-3 hidden">
                    <span id="navRoleBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-vbdGreen border border-green-200">
                        Volunteer
                    </span>
                    <button onclick="logout()" class="text-sm font-medium text-gray-600 hover:text-vbdRed transition flex items-center gap-1 bg-gray-100 px-3 py-1.5 rounded-lg">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
        
        <!-- Auth Section -->
        <div id="authSection" class="max-w-md mx-auto my-8 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <div class="text-center mb-8">
                <img src="https://raw.githubusercontent.com/vbd-assets/logos/main/vbd-logo.png" onerror="this.src='https://ui-avatars.com/api/?name=VBD&background=E31B23&color=fff';" class="h-20 mx-auto mb-3 object-contain">
                <h2 class="text-2xl font-bold text-gray-800">Panel Login</h2>
                <p class="text-sm text-gray-500 mt-1">Access Admin or Volunteer Account</p>
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
                <button onclick="demoLogin('district')" class="p-3.5 border border-red-300 bg-red-50 text-vbdRed font-bold rounded-xl hover:bg-red-100 transition shadow-sm">
                    <i class="fa-solid fa-crown block text-center mb-1 text-base"></i> District Board (Admin)
                </button>
                <button onclick="demoLogin('volunteer')" class="p-3.5 border border-green-300 bg-green-50 text-vbdGreen font-bold rounded-xl hover:bg-green-100 transition shadow-sm">
                    <i class="fa-solid fa-user-check block text-center mb-1 text-base"></i> Volunteer Profile
                </button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden space-y-6">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center gap-4">
                    <div id="userAvatar" class="w-12 h-12 bg-vbdGreen text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md">V</div>
                    <div>
                        <h2 id="userNameDisplay" class="font-bold text-xl text-gray-800">Welcome</h2>
                        <p id="userRoleDetail" class="text-xs text-gray-500">Dhaka South District</p>
                    </div>
                </div>
            </div>

            <!-- Admin Control -->
            <div id="adminControls" class="bg-gradient-to-r from-vbdGreen to-vbdDarkGreen text-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-bold">Event Management Panel</h3>
                    <p class="text-xs text-green-100">Add new events with live location search</p>
                </div>
                <button onclick="openCreateEventModal()" class="px-4 py-2.5 bg-vbdYellow text-gray-900 rounded-xl font-bold text-sm shadow hover:bg-yellow-400 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Create New Event
                </button>
            </div>

            <div id="eventsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamic Events -->
            </div>
        </div>

    </main>

    <!-- Create Event Modal -->
    <div id="createEventModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4 my-8">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-map-location-dot text-vbdRed mr-1"></i> Google Maps Venue Location</h3>
                <button onclick="closeCreateEventModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form onsubmit="saveNewEvent(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Event Title *</label>
                    <input type="text" id="evName" required placeholder="e.g. Plastic Cleaning Drive" class="w-full border rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-vbdGreen">
                </div>

                <!-- Live Auto-Suggest Search Input + Search Button -->
                <div class="relative">
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">
                        <i class="fa-solid fa-magnifying-glass text-vbdRed mr-1"></i> Search Venue/Location *
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" oninput="handleSearchTyping()" placeholder="e.g. Jaago Foundation, Star Kabab, Dhanmondi 27" class="flex-1 border-2 border-vbdGreen rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-vbdGreen">
                        <button type="button" onclick="performManualSearch()" class="px-4 py-2 bg-vbdGreen text-white font-bold text-xs rounded-xl hover:bg-green-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-magnifying-glass"></i> Search
                        </button>
                    </div>
                    <!-- Auto Suggestion List -->
                    <div id="suggestionsList" class="search-suggestion-box hidden"></div>
                </div>

                <!-- Live Google Map View -->
                <div class="rounded-xl overflow-hidden border border-gray-200 h-64 bg-gray-100">
                    <iframe id="googleMapIframe" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        src="https://maps.google.com/maps?q=Bahadur%20Shah%20Park,%20Dhaka&t=&z=15&ie=UTF8&iwloc=&output=embed">
                    </iframe>
                </div>

                <div class="bg-gray-50 p-2.5 rounded-xl border text-xs text-gray-600">
                    <span class="font-bold text-gray-700">Selected Location: </span>
                    <span id="selectedAddressText">Bahadur Shah Park, Dhaka</span>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeCreateEventModal()" class="w-1/2 py-2.5 border rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-vbdGreen text-white rounded-xl font-bold text-sm shadow hover:bg-green-700">Publish Event</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedAddress = "Bahadur Shah Park, Dhaka";
        let debounceTimer;

        window.eventsList = [
            {
                id: 'ev_101',
                title: 'Tree Plantation & Plastic Awareness Drive',
                venue: 'Bahadur Shah Park, Old Dhaka',
            }
        ];

        // Live Typing Auto Suggestions
        function handleSearchTyping() {
            clearTimeout(debounceTimer);
            const query = document.getElementById('searchInput').value.trim();
            const box = document.getElementById('suggestionsList');

            if (query.length < 2) {
                box.classList.add('hidden');
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=bd&limit=5`)
                    .then(res => res.json())
                    .then(data => {
                        box.innerHTML = '';
                        if (data.length === 0) {
                            box.innerHTML = `<div class="p-3 text-xs text-gray-500">No locations found</div>`;
                        } else {
                            data.forEach(item => {
                                const div = document.createElement('div');
                                div.className = 'p-2.5 text-xs text-gray-700 hover:bg-green-50 cursor-pointer border-b border-gray-100 flex items-center gap-2';
                                div.innerHTML = `<i class="fa-solid fa-location-dot text-vbdRed"></i> <span>${item.display_name}</span>`;
                                div.onclick = () => updateMapLocation(item.display_name);
                                box.appendChild(div);
                            });
                        }
                        box.classList.remove('hidden');
                    });
            }, 250);
        }

        // Search Button Handler
        function performManualSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            updateMapLocation(query);
        }

        // Update Google Map Location
        function updateMapLocation(locationName) {
            selectedAddress = locationName;
            document.getElementById('selectedAddressText').innerText = locationName;
            document.getElementById('searchInput').value = locationName.split(',')[0];
            document.getElementById('suggestionsList').classList.add('hidden');

            const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(locationName)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('googleMapIframe').src = embedUrl;
        }

        function openCreateEventModal() {
            document.getElementById('createEventModal').classList.remove('hidden');
        }

        function closeCreateEventModal() {
            document.getElementById('createEventModal').classList.add('hidden');
        }

        function demoLogin(role) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('navUserMenu').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = role === 'district' ? 'Admin (District Board)' : 'Tanvir (Volunteer)';
            renderEvents();
        }

        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';
            window.eventsList.forEach(ev => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                        <h4 class="font-bold text-gray-800">${ev.title}</h4>
                        <p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot text-vbdRed mr-1"></i>${ev.venue}</p>
                    </div>
                `;
            });
        }

        function saveNewEvent(e) {
            e.preventDefault();
            const venueInput = document.getElementById('searchInput').value || selectedAddress;
            window.eventsList.unshift({
                id: 'ev_' + Date.now(),
                title: document.getElementById('evName').value,
                venue: venueInput,
            });
            closeCreateEventModal();
            renderEvents();
            alert('Event and location saved successfully!');
        }

        function logout() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('navUserMenu').classList.add('hidden');
        }
    </script>
</body>
</html>
