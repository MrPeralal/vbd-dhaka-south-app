<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluation Portal - VBD</title>
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-green: #006039;
      --primary-dark: #004d2e;
      --bg-light: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #edf2f7;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* AUTH CONTAINER & CARD */
    #auth-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .auth-logo {
      width: 70px;
      height: 70px;
      background: var(--primary-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #e2b007;
      font-size: 32px;
      font-weight: 800;
      border: 2px solid #e2b007;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 2px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #8c9ba5;
      margin-bottom: 30px;
    }

    .auth-form {
      text-align: left;
    }

    .auth-form label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .auth-form input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 20px;
      color: #2d3748;
    }

    .auth-form input::placeholder {
      color: #a0aec0;
    }

    .auth-form input:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(0, 96, 57, 0.15);
    }

    .btn-auth {
      width: 100%;
      background: var(--primary-green);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-auth:hover {
      background: var(--primary-dark);
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 12px;
    }

    .auth-links a {
      color: var(--primary-green);
      text-decoration: none;
      font-weight: 600;
    }

    /* LOADING SPINNER */
    .spinner {
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- AUTH CONTAINER -->
  <div id="auth-container">
    <div class="auth-card">
      <div class="auth-logo">V</div>
      <h2 class="auth-title">Evaluation Portal</h2>
      <p class="auth-subtitle">VBD Dhaka District (South)</p>
      
      <!-- STEP 1: EMAIL ENTRY -->
      <form id="step1-form" class="auth-form" onsubmit="handleStep1(event)">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="name@vbd.com.bd" required autocomplete="email">
        <button type="submit" id="btn-continue" class="btn-auth">
          <span>Continue</span>
        </button>
      </form>

      <!-- STEP 2: PASSWORD ENTRY -->
      <form id="step2-form" class="auth-form" style="display: none;" onsubmit="handleStep2(event)">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
          Password for <b id="display-email" style="color: var(--primary-green);"></b>
        </p>
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="Enter your password" required>
        <button type="submit" class="btn-auth">Login <i class="fa-solid fa-right-to-bracket"></i></button>
        <div class="auth-links">
          <a href="#" onclick="resetAuthStep()">Use Different Email</a>
          <a href="#">Forgot Password?</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBczq-XndpBFaTxKBKIolpIQ9HjM_uqHbfW4zU39JhTQsJSGIsnBFXzu0ryU7MPTn6PA/exec";

    function handleStep1(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      if(!email) return;

      const btn = document.getElementById('btn-continue');
      btn.innerHTML = `<div class="spinner"></div> Verifying...`;
      btn.disabled = true;

      // Apps Script API call or Timeout fallback
      let isMoved = false;

      const moveToPassword = () => {
        if(!isMoved) {
          isMoved = true;
          document.getElementById('display-email').innerText = email;
          document.getElementById('step1-form').style.display = 'none';
          document.getElementById('step2-form').style.display = 'block';
          btn.innerHTML = `<span>Continue</span>`;
          btn.disabled = false;
        }
      };

      // 1.5 সেকেন্ড পরে আপনাআপনি পাসওয়ার্ড ইনপুটে চলে যাবে (যদি নেটওয়ার্ক বা CORS ব্লকিং থাকে)
      setTimeout(moveToPassword, 1500);

      fetch(`${SCRIPT_URL}?action=getUserData&email=${encodeURIComponent(email)}`)
        .then(res => res.json())
        .then(data => {
          moveToPassword();
        })
        .catch(err => {
          moveToPassword();
        });
    }

    function handleStep2(e) {
      e.preventDefault();
      alert("Successfully Logged In!");
    }

    function resetAuthStep() {
      document.getElementById('step2-form').style.display = 'none';
      document.getElementById('step1-form').style.display = 'block';
    }
  </script>
</body>
</html>
